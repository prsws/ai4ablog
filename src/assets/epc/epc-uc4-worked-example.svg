<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="UC4 fan command as an EPC: wake word heard, parse the command, then an XOR split. Understood leads to switch the fan off and Fan is off. Not understood leads to ask the speaker to repeat and Repeat requested.">
  <rect width="640" height="440" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3c4a52"/></marker>
  </defs>
  <g font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" fill="#17262d" text-anchor="middle">
    <text x="320" y="34" font-size="17" font-weight="700">Read it as: event, so function, so event</text>
    <g fill="none" stroke="#3c4a52" stroke-width="1.5">
      <path d="M320 98V117" marker-end="url(#a)"/>
      <path d="M320 162V181" marker-end="url(#a)"/>
      <path d="M302 200H180V237" marker-end="url(#a)"/>
      <path d="M338 200H460V237" marker-end="url(#a)"/>
      <path d="M180 282V301" marker-end="url(#a)"/>
      <path d="M460 282V301" marker-end="url(#a)"/>
      <path d="M180 346V365" marker-end="url(#a)"/>
      <path d="M460 346V365" marker-end="url(#a)"/>
    </g>
    <polygon points="200,76 216,54 424,54 440,76 424,98 216,98" fill="#f9e3ef" stroke="#a63d78" stroke-width="1.5"/>
    <text x="320" y="81">Wake word heard</text>
    <rect x="200" y="118" width="240" height="44" rx="10" fill="#e1f2e3" stroke="#2f7d43" stroke-width="1.5"/>
    <text x="320" y="145">Parse the command</text>
    <circle cx="320" cy="200" r="18" fill="#ffffff" stroke="#3c4a52" stroke-width="1.5"/>
    <text x="320" y="206" font-size="18" font-weight="700">×</text>
    <text x="348" y="190" text-anchor="start" font-size="13" fill="#4f5d66">XOR: one branch only</text>
    <polygon points="60,260 76,238 284,238 300,260 284,282 76,282" fill="#f9e3ef" stroke="#a63d78" stroke-width="1.5"/>
    <text x="180" y="265">Command understood</text>
    <polygon points="340,260 356,238 564,238 580,260 564,282 356,282" fill="#f9e3ef" stroke="#a63d78" stroke-width="1.5"/>
    <text x="460" y="265">Command not understood</text>
    <rect x="60" y="302" width="240" height="44" rx="10" fill="#e1f2e3" stroke="#2f7d43" stroke-width="1.5"/>
    <text x="180" y="329">Switch the fan off</text>
    <rect x="340" y="302" width="240" height="44" rx="10" fill="#e1f2e3" stroke="#2f7d43" stroke-width="1.5"/>
    <text x="460" y="329">Ask the speaker to repeat</text>
    <polygon points="60,388 76,366 284,366 300,388 284,410 76,410" fill="#f9e3ef" stroke="#a63d78" stroke-width="1.5"/>
    <text x="180" y="393" font-weight="700">Fan is off</text>
    <polygon points="340,388 356,366 564,366 580,388 564,410 356,410" fill="#f9e3ef" stroke="#a63d78" stroke-width="1.5"/>
    <text x="460" y="393" font-weight="700">Repeat requested</text>
  </g>
</svg>
