<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 690" role="img" aria-labelledby="t d" font-family="Figtree, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <title id="t">Where the Self Monitoring Arm sits in Pepa, and what it reports to</title>
  <desc id="d">The Head sits above Pepa's arms. The Self Monitoring Arm is drawn open: a planned helper supervisor above five helpers. Three helpers work today (household power, Home Assistant history, the arm's own body) and two are planned (other Home Assistants, inference hosts). Dashed arrows lead from the arm to a person and to operations tooling such as Kubernetes or Ansible. No arrow leads back into the machines the arm watches, because the arm cannot repair anything.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 z" fill="#304754"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="838" height="688" rx="16" fill="#f7fafb" stroke="#dde5e9" stroke-width="2"/>

  <!-- The Head (faint context) -->
  <rect x="310" y="24" width="220" height="44" rx="10" fill="#eef2f4" stroke="#bdcad1" stroke-width="1.5"/>
  <text x="420" y="52" text-anchor="middle" font-size="15" font-weight="600" fill="#4a6270">The Head (orchestrator)</text>

  <!-- Bus and drops (faint) -->
  <path d="M420 68 V96 M253 96 H757 M253 96 V120 M379 96 V120 M505 96 V120 M631 96 V120 M757 96 V120" fill="none" stroke="#93a5b0" stroke-width="1.5"/>
  <!-- Head to Self Monitoring: planned route -->
  <path d="M253 96 H104 V120" fill="none" stroke="#1a7191" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Other arms (faint context) -->
  <g font-size="13.5" font-weight="600" fill="#4a6270" text-anchor="middle">
    <rect x="194" y="120" width="118" height="36" rx="10" fill="#eef2f4" stroke="#bdcad1" stroke-width="1.5"/><text x="253" y="143">Sensory</text>
    <rect x="320" y="120" width="118" height="36" rx="10" fill="#eef2f4" stroke="#bdcad1" stroke-width="1.5"/><text x="379" y="143">Memory</text>
    <rect x="446" y="120" width="118" height="36" rx="10" fill="#eef2f4" stroke="#bdcad1" stroke-width="1.5"/><text x="505" y="143">Knowledge</text>
    <rect x="572" y="120" width="118" height="36" rx="10" fill="#eef2f4" stroke="#bdcad1" stroke-width="1.5"/><text x="631" y="143">Human Sentinel</text>
    <rect x="698" y="120" width="118" height="36" rx="10" fill="#eef2f4" stroke="#bdcad1" stroke-width="1.5"/><text x="757" y="143">Reasoning</text>
  </g>

  <!-- Self Monitoring pill (in focus) and link to the open view -->
  <rect x="24" y="120" width="160" height="36" rx="10" fill="#238bad" stroke="#135773" stroke-width="1.5"/>
  <text x="104" y="143" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Self Monitoring</text>
  <path d="M104 156 V196" stroke="#238bad" stroke-width="2"/>

  <!-- The arm, opened up -->
  <rect x="24" y="196" width="792" height="244" rx="16" fill="#f0f9fb" stroke="#238bad" stroke-width="2"/>
  <text x="40" y="226" font-size="16" font-weight="700" fill="#0b3247">Pepa Self Monitoring Arm, on a 2010 Mac mini</text>

  <!-- Supervisor (planned) -->
  <rect x="41" y="242" width="758" height="46" rx="10" fill="#ffffff" stroke="#6b8290" stroke-width="1.75" stroke-dasharray="7 5"/>
  <text x="420" y="262" text-anchor="middle" font-size="14.5" font-weight="700" fill="#203542">Helper supervisor <tspan font-weight="500" fill="#4a6270">· planned</tspan></text>
  <text x="420" y="279" text-anchor="middle" font-size="12.5" fill="#4a6270">one helper per kind of thing watched, and a check that each is alive</text>

  <!-- Supervisor to helpers (planned) -->
  <path d="M112 288 V324 M266 288 V324 M420 288 V324 M574 288 V324 M728 288 V324" stroke="#6b8290" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>

  <!-- Helpers working today -->
  <g text-anchor="middle">
    <rect x="41" y="324" width="142" height="92" rx="10" fill="#ffffff" stroke="#1a7191" stroke-width="2.25"/>
    <text x="112" y="350" font-size="14.5" font-weight="700" fill="#0b3247">Household</text>
    <text x="112" y="368" font-size="14.5" font-weight="700" fill="#0b3247">power</text>
    <circle cx="86" cy="396" r="5" fill="#1a7191"/><text x="96" y="400" font-size="13" font-weight="600" fill="#135773" text-anchor="start">working</text>

    <rect x="195" y="324" width="142" height="92" rx="10" fill="#ffffff" stroke="#1a7191" stroke-width="2.25"/>
    <text x="266" y="350" font-size="14.5" font-weight="700" fill="#0b3247">Home Assistant</text>
    <text x="266" y="368" font-size="14.5" font-weight="700" fill="#0b3247">history</text>
    <circle cx="240" cy="396" r="5" fill="#1a7191"/><text x="250" y="400" font-size="13" font-weight="600" fill="#135773" text-anchor="start">working</text>

    <rect x="349" y="324" width="142" height="92" rx="10" fill="#ffffff" stroke="#1a7191" stroke-width="2.25"/>
    <text x="420" y="350" font-size="14.5" font-weight="700" fill="#0b3247">The arm's</text>
    <text x="420" y="368" font-size="14.5" font-weight="700" fill="#0b3247">own body</text>
    <circle cx="394" cy="396" r="5" fill="#1a7191"/><text x="404" y="400" font-size="13" font-weight="600" fill="#135773" text-anchor="start">working</text>

    <!-- Helpers planned -->
    <rect x="503" y="324" width="142" height="92" rx="10" fill="#ffffff" stroke="#6b8290" stroke-width="1.75" stroke-dasharray="7 5"/>
    <text x="574" y="350" font-size="14.5" font-weight="700" fill="#203542">Other Home</text>
    <text x="574" y="368" font-size="14.5" font-weight="700" fill="#203542">Assistants</text>
    <text x="574" y="400" font-size="13" font-weight="500" fill="#4a6270">planned</text>

    <rect x="657" y="324" width="142" height="92" rx="10" fill="#ffffff" stroke="#6b8290" stroke-width="1.75" stroke-dasharray="7 5"/>
    <text x="728" y="350" font-size="14.5" font-weight="700" fill="#203542">Inference</text>
    <text x="728" y="368" font-size="14.5" font-weight="700" fill="#203542">hosts</text>
    <text x="728" y="400" font-size="13" font-weight="500" fill="#4a6270">planned</text>
  </g>

  <!-- Reports leave the arm (hand-off not built yet) -->
  <path d="M250 440 V496" stroke="#304754" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#ah)"/>
  <path d="M590 440 V496" stroke="#304754" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#ah)"/>
  <text x="262" y="474" font-size="13" font-weight="600" fill="#304754">reports</text>
  <text x="602" y="474" font-size="13" font-weight="600" fill="#304754">reports</text>

  <rect x="130" y="500" width="240" height="56" rx="12" fill="#ffffff" stroke="#304754" stroke-width="1.75"/>
  <text x="250" y="534" text-anchor="middle" font-size="15.5" font-weight="700" fill="#142530">A person</text>
  <rect x="470" y="500" width="240" height="56" rx="12" fill="#ffffff" stroke="#304754" stroke-width="1.75"/>
  <text x="590" y="525" text-anchor="middle" font-size="15.5" font-weight="700" fill="#142530">Operations tooling</text>
  <text x="590" y="545" text-anchor="middle" font-size="12.5" fill="#4a6270">Kubernetes, Ansible, monitoring</text>

  <!-- The point of the picture -->
  <rect x="24" y="578" width="792" height="52" rx="12" fill="#dcf1f5" stroke="#7fc7dc" stroke-width="1.5"/>
  <circle cx="54" cy="604" r="11" fill="none" stroke="#0f425c" stroke-width="2.25"/>
  <path d="M49 599 L59 609 M59 599 L49 609" stroke="#0f425c" stroke-width="2.25" stroke-linecap="round"/>
  <text x="78" y="600" font-size="14.5" font-weight="700" fill="#0f425c">No arrow goes back into the machines it watches.</text>
  <text x="78" y="618" font-size="13.5" fill="#0f425c">The arm has no verb for repair. Acting on a report is the job of people and their tools.</text>

  <!-- Legend -->
  <g font-size="12.5" fill="#304754">
    <rect x="24" y="651" width="26" height="14" rx="4" fill="#ffffff" stroke="#1a7191" stroke-width="2.25"/>
    <text x="58" y="663">working today</text>
    <rect x="170" y="651" width="26" height="14" rx="4" fill="#ffffff" stroke="#6b8290" stroke-width="1.75" stroke-dasharray="5 3"/>
    <text x="204" y="663">planned, not built yet</text>
    <rect x="368" y="651" width="26" height="14" rx="4" fill="#eef2f4" stroke="#bdcad1" stroke-width="1.5"/>
    <text x="402" y="663">the rest of Pepa, shown only for context</text>
  </g>
</svg>
